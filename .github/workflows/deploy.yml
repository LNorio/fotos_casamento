name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # VITE_BASE sai de GITHUB_REPOSITORY ("dono/repo"), que existe em
      # qualquer evento — ao contrário de github.event.repository, que
      # some em alguns e deixaria o base como "//", quebrando os assets.
      # Com domínio próprio, troque a expressão por "/".
      - name: Build
        env:
          # Cadastre em Settings → Secrets and variables → Actions.
          VITE_WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: |
          export VITE_BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "base: $VITE_BASE"
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
